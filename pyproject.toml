[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_abm_ga"
version = "0.1.0"
description = "Evolutionary System-Prompt Optimization for LLM Agents"
authors = [
    {name = "Anonymous Researchers"}
]
dependencies = [
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
