[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_abm_ga"
version = "0.1.0"
description = "Evolutionary system-prompt optimization for LLM agents in a competitive agent-based market"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OsaIoT" }]
keywords = ["llm", "agents", "genetic-algorithm", "prompt-optimization", "agent-based-model"]
dependencies = [
    "numpy>=1.24",
    "openai>=1.0",
    "google-genai>=0.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Re-create the figures and tables in the README from the committed logs (no API key needed).
analysis = ["scipy>=1.10", "matplotlib>=3.7"]
# Run the interactive notebooks in notebooks/.
notebooks = ["jupyter>=1.0", "matplotlib>=3.7"]
dev = ["pytest>=7", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/OsaIoT/llm-abm-optimization"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
